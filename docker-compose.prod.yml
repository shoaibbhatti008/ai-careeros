# ============================================================
# AI CareerOS — Production Docker Compose
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
# ============================================================

name: ai-careeros-prod

services:
  # ---------- PostgreSQL (with pgvector) ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeros}
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careeros}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: careeros-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # ---------- Backend (Gunicorn) ----------
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
      target: runtime
    image: ai-careeros-backend:latest
    container_name: careeros-backend
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - static-data:/app/staticfiles
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
      target: runtime
    image: ai-careeros-backend:latest
    container_name: careeros-celery-worker
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------- Celery Beat ----------
  celery-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
      target: runtime
    image: ai-careeros-backend:latest
    container_name: careeros-celery-beat
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ---------- Frontend (Nginx-served React) ----------
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
    image: ai-careeros-frontend:latest
    container_name: careeros-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careeros-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------- Nginx Reverse Proxy ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: careeros-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/proxy_params_careeros:/etc/nginx/proxy_params_careeros:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - static-data:/var/www/static:ro
      - media-data:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - careeros-network

networks:
  careeros-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data: