# ============================================================
# AI CareerOS — Main Server Block
# ============================================================

# ---------- HTTP → HTTPS Redirect ----------
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS Main Server ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Auth endpoints (strict) ----
    location ~ ^/api/(auth|users)/(login|register|token|refresh)/?$ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_careeros;
    }

    # ---- API ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_careeros;
    }

    # ---- Django Admin ----
    location /admin/ {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_careeros;
    }

    # ---- Static ----
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Media ----
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- Health ----
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- Frontend SPA ----
    location / {
        limit_req zone=general_limit burst=60 nodelay;
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params_careeros;
    }
}